name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4

      - name: .NET 8 설정
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 애플리케이션 의존성 복원
        run: dotnet restore SimpleIoT.Gateway.csproj

      - name: 애플리케이션 빌드
        run: dotnet build SimpleIoT.Gateway.csproj --no-restore -c Release

      - name: 테스트 실행
        run: dotnet test tests/SimpleIoT.Gateway.Tests/SimpleIoT.Gateway.Tests.csproj -c Release

      - name: Docker 이미지 빌드
        run: docker build -t simple-iot-gateway .
